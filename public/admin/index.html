<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<meta name="robots" content="noindex">
<title>Admin | Wild Nation</title>
<link rel="icon" href="/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  body::after{display:none}
  .adm-nav{position:sticky;top:0;z-index:20;background:rgba(8,6,13,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .adm-nav .wrap{display:flex;align-items:center;gap:6px;height:64px;overflow-x:auto}
  .adm-nav img{height:32px;margin-right:12px}
  .adm-nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .adm-nav a.on,.adm-nav a:hover{background:var(--surface-2);color:#fff}
  .adm-nav .sp{flex:1}
  .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--magenta);color:#fff;font-size:11px;margin-left:4px}
  main{padding:32px 0 80px}
  h1.t{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(36px,5vw,56px);margin:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:28px}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .stat-card small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
  .stat-card b{display:block;font-family:var(--display);font-weight:400;font-size:38px;margin-top:4px}
  .ev-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:10px;text-decoration:none}
  .ev-row:hover{border-color:var(--line-2);background:var(--surface-2)}
  .ev-row .th{width:64px;height:80px;border-radius:10px;background:#2a0f3d center/cover}
  .ev-row h3{margin:0;font-size:18px}
  .ev-row .m{font-size:13px;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;max-width:280px}
  .bar i{display:block;height:100%;background:var(--lime)}
  .pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
  .pill.published,.pill.confirmed,.pill.ok{background:rgba(214,251,81,.15);color:var(--lime)}
  .pill.draft,.pill.new{background:rgba(247,231,105,.15);color:var(--gold)}
  .pill.cancelled,.pill.declined,.pill.void{background:rgba(255,92,122,.15);color:var(--danger)}
  .pill.quoted{background:rgba(76,94,240,.2);color:#a9b3ff}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
  .tabs button{background:none;border:0;color:var(--muted);font:600 15px var(--body);padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--text);border-color:var(--lime)}
  .tier-ed{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:rgba(0,0,0,.2)}
  .tier-ed .full{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .tier-ed .field{margin:0}
  @media (max-width:760px){.tier-ed,.tier-ed .full{grid-template-columns:1fr 1fr}}
  .flyer-drop{border:2px dashed var(--line-2);border-radius:16px;aspect-ratio:4/5;display:grid;place-items:center;text-align:center;cursor:pointer;background:#140f1f center/cover;color:var(--muted);position:relative;overflow:hidden}
  .flyer-drop.has span{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px;color:#fff;opacity:0;transition:opacity .2s}
  .flyer-drop.has:hover span{opacity:1}
  .ed-grid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
  @media (max-width:860px){.ed-grid{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
  .tbl table td:first-child,.tbl table th:first-child{padding-left:16px}
  .link{background:none;border:0;color:var(--lime);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
  .sticky-save{position:sticky;bottom:0;background:rgba(8,6,13,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 0;margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .login{max-width:380px;margin:12vh auto;text-align:center}
  details.bk{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px}
  details.bk summary{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
  details.bk summary::-webkit-details-marker{display:none}
  details.bk .body{padding:0 16px 16px;display:grid;gap:4px;font-size:14px}
  details.bk .body div{display:grid;grid-template-columns:140px 1fr;gap:10px}
  details.bk .body div span:first-child{color:var(--muted)}
  select.inline{width:auto;padding:6px 10px;font-size:13px;border-radius:999px}
  .contract-box{margin-top:14px;padding:18px;border:1px solid rgba(214,251,81,.25);border-radius:14px;background:rgba(214,251,81,.04);display:block !important}
  .contract-box .top{display:flex !important;justify-content:space-between;align-items:center;gap:12px}
  details.bk .body .contract-box div{display:revert;grid-template-columns:none}
  .cgrid{display:grid !important;grid-template-columns:repeat(4,1fr) !important;gap:10px}
  .cgrid2{display:grid !important;grid-template-columns:3fr 1fr !important;gap:10px;margin-top:8px}
  .cform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .cform input,.cform select{padding:9px 11px;font-size:14px}
  @media (max-width:760px){.cgrid{grid-template-columns:1fr 1fr !important}}
  .cpreview{margin:14px 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25);font-size:14px}
  .inv-row{display:flex !important;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px}
  .inv-row span{color:var(--muted)}
  .inv-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:16px}
  .steps{display:flex !important;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .step{display:flex !important;align-items:center;gap:8px;font-size:14px}
  .step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid !important;place-items:center;font-style:normal;font-size:12px;color:#000}
  .step.done i{background:var(--lime);border-color:var(--lime)}
</style>
</head>
<body data-bare="1">
<div id="app"></div>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/blog.js"></script>
<script src="/assets/js/booking-config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
