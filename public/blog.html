<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<title>Blog | Wild Nation</title>
<meta name="description" content="Recaps, news and stories from Wild Nation Events and DJ Wild Soja across Hamilton, Toronto and Niagara.">
</head>
<body data-page="blog">
<header class="page-head" style="padding-bottom:40px">
  <div class="bgimg"></div><div class="glow m" style="width:420px;height:420px;right:-120px;top:30px"></div>
  <div class="wrap">
    <span class="eyebrow">The blog</span>
    <h1 class="display h-xl" style="margin-top:14px">Stories<br><span class="lime">from the night</span></h1>
    <p class="lead">Recaps, announcements and everything in between. Missed a party? Catch up here.</p>
  </div>
</header>
<section class="section" style="padding-top:30px">
  <div class="wrap">
    <div id="feature"></div>
    <div class="blog-filters" id="filters" role="group" aria-label="Filter posts"></div>
    <div class="post-list" id="list"><p class="muted" style="padding:30px 0">Loading…</p></div>
  </div>
</section>
<script src="assets/js/preview-data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/blog.js"></script>
<script>
(async function () {
  const list = document.getElementById("list");
  let posts = [];
  try { posts = await WNBlog.posts(); } catch (e) { list.innerHTML = '<p class="muted" style="padding:30px 0">Couldn\'t load posts. Refresh to try again.</p>'; return; }
  if (!posts.length) { list.innerHTML = '<div class="empty-state" style="margin-top:20px"><h3>No posts yet</h3><p>Check back soon.</p></div>'; return; }
  const [first, ...rest] = posts;
  document.getElementById("feature").innerHTML = WNBlog.feature(first);
  const tags = [...new Set(rest.map((p) => p.tag).filter(Boolean))];
  const filters = document.getElementById("filters");
  if (tags.length > 1) filters.innerHTML = ["All", ...tags].map((t, i) => `<button class="${i ? "" : "on"}" data-t="${WN.esc(t)}">${WN.esc(t)}</button>`).join("");
  else filters.remove();
  const draw = (t) => { list.innerHTML = rest.filter((p) => t === "All" || p.tag === t).map(WNBlog.row).join(""); WN.reveal(list); };
  draw("All");
  filters.addEventListener?.("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filters.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    draw(b.dataset.t);
  });
  WN.reveal();
})();
</script>
</body>
</html>
