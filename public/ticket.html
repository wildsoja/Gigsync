<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<link rel="icon" href="/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Ticket | Wild Nation</title>
<meta name="robots" content="noindex">
</head>
<body data-page="events" data-solid-nav="1" data-no-footer="1">
<main class="center-page"><div class="wrap" id="root"></div></main>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/ticket-card.js"></script>
<script>
(async function () {
  const root = document.getElementById("root");
  const token = decodeURIComponent(location.pathname.split("/").pop());
  try {
    const t = await WN.api("/api/tickets/" + encodeURIComponent(token));
    document.title = t.event.title + " ticket | Wild Nation";
    root.innerHTML = WN_ticketCard(t, t.event) + `
      <p class="muted no-print" style="text-align:center;margin-top:22px;font-size:14px">Show this QR code at the door. Turn your screen brightness up.<br>
      <a href="/event/${encodeURIComponent(t.event.slug)}" class="lime">Event details</a></p>`;
  } catch (e) {
    root.innerHTML = '<div class="empty-state"><h3>Ticket not found</h3><p>This ticket link isn\'t valid. Check your email for the right link.</p></div>';
  }
})();
</script>
</body>
</html>
