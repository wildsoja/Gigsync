<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<link rel="icon" href="/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<title>Unsubscribe | Wild Nation</title>
<meta name="robots" content="noindex">
</head>
<body data-solid-nav="1">
<main class="center-page" style="display:grid;place-items:center;text-align:center"><div class="wrap" id="root" style="max-width:560px">
  <h1 class="display h-md">Unsubscribe</h1>
  <p class="lead" style="margin:14px auto 26px">Stop getting Wild Nation event updates at <b id="em" style="color:var(--text)"></b>?</p>
  <button class="btn lg" id="go">Unsubscribe me</button>
  <div class="form-msg" id="msg"></div>
</div></main>
<script src="/assets/js/site.js"></script>
<script>
const p = new URLSearchParams(location.search), e = p.get("e") || "", t = p.get("t") || "";
document.getElementById("em").textContent = e;
document.getElementById("go").onclick = async () => {
  try {
    await WN.api("/api/unsubscribe", { method: "POST", body: { e, t } });
    document.getElementById("root").innerHTML = '<h1 class="display h-md">You\'re unsubscribed</h1><p class="lead" style="margin:14px auto 26px">You won\'t get any more updates. Changed your mind? Sign up again any time.</p><a class="btn" href="/">Back to the site</a>';
  } catch (err) { const m = document.getElementById("msg"); m.className = "form-msg err"; m.textContent = err.message; }
};
</script>
</body>
</html>
